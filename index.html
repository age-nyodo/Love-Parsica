<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <title>Love-Parsica</title>

  <style>

    /* サイト全体 */
    body {
      margin: 0;
      font-family: serif;
      text-align: center;
    }


    /* ショップ名 */
    h1 {
      font-size: 50px;
      margin-top: 80px;
    }


    /* Category */
    .category {
      margin: 50px 0;
    }


    /* Categoryの文字 */
    .category summary {
      font-size: 18px;
      cursor: pointer;
    }


    /* 開いたときのカテゴリー一覧 */
    .category-menu {
      margin-top: 15px;
    }


    /* ALL / BAG / POUCH / KEYCHAIN */
    .category-menu a {
      display: block;
      margin: 10px;

      text-decoration: none;
      color: inherit;
    }


    /* 商品を並べる場所 */
    .products {
      display: grid;

      grid-template-columns: repeat(2, 250px);

      gap: 50px;

      justify-content: center;
    }


    /* 商品 */
    .product {
      text-align: center;
    }


    /* 商品画像 */
    .product-image {
      width: 250px;
      height: 250px;

      background-color: #f5f5f5;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    /* 商品名 */
    .product-name {
      font-size: 20px;
      margin-top: 15px;
    }


    /* 商品名のリンク */
    .product-name a {
      text-decoration: none;
      color: inherit;
    }


    /* 値段 */
    .price {
      font-size: 16px;
      margin-top: 5px;
    }

  </style>

</head>


<body>


  <!-- ショップ名 -->

  <h1>Love Parsica</h1>



  <!-- カテゴリー -->

  <details class="category">

    <summary>Category</summary>

    <div class="category-menu">

      <a href="#">ALL</a>

      <a href="#">BAG</a>

      <a href="#">POUCH</a>

      <a href="#">KEYCHAIN</a>

    </div>

  </details>



  <!-- 商品一覧 -->

  <div class="products">


    <!-- 商品1 -->

    <div class="product">

      <div class="product-image">
        仮の商品画像
      </div>

      <div class="product-name">

        <a href="product.html">
          Star Pouch
        </a>

      </div>

      <div class="price">
        ¥2,500
      </div>

    </div>



    <!-- 商品2 -->

    <div class="product">

      <div class="product-image">
        仮の商品画像
      </div>

      <div class="product-name">

        <a href="product2.html">
          Ribbon Bag
        </a>

      </div>

      <div class="price">
        ¥3,500
      </div>

    </div>



    <!-- 商品3 -->

    <div class="product">

      <div class="product-image">
        仮の商品画像
      </div>

      <div class="product-name">

        <a href="product3.html">
          Heart Keychain
        </a>

      </div>

      <div class="price">
        ¥1,500
      </div>

    </div>



    <!-- 商品4 -->

    <div class="product">

      <div class="product-image">
        仮の商品画像
      </div>

      <div class="product-name">

        <a href="product4.html">
          Mini Pouch
        </a>

      </div>

      <div class="price">
        ¥2,000
      </div>

    </div>


  </div>


</body>

</html>
