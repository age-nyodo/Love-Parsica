<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <title>Love-Parsica</title>

  <style>

    /* サイト全体 */
    body {
      margin: 0;
      font-family: serif;
      text-align: center;
    }


    /* ショップ名 */
    h1 {
      font-size: 50px;
      margin-top: 80px;
    }


    /* Category */
    .category {
      margin: 50px 0;
    }


    /* Categoryの文字 */
    .category summary {
      font-size: 18px;
      cursor: pointer;
    }


    /* カテゴリーメニュー */
    .category-menu {
      margin-top: 15px;
    }


    /* ALL / BAG / POUCH / KEYCHAIN */
    .category-menu button {
      display: block;

      margin: 10px auto;

      background: none;
      border: none;

      font-family: serif;
      font-size: 16px;

      cursor: pointer;
    }


    /* 商品を並べる場所 */
    .products {
      display: grid;

      grid-template-columns: repeat(2, 250px);

      gap: 50px;

      justify-content: center;
    }


    /* 商品 */
    .product {
      text-align: center;
    }


    /* 商品画像 */
    .product-image {
      width: 250px;
      height: 250px;

      background-color: #f5f5f5;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
    }


    /* 商品画像のリンク */
    .product-image-link {
      text-decoration: none;
      color: inherit;
    }


    /* 商品名 */
    .product-name {
      font-size: 20px;
      margin-top: 15px;
    }


    /* 値段 */
    .price {
      font-size: 16px;
      margin-top: 5px;
    }

  </style>

</head>


<body>


  <!-- ショップ名 -->

  <h1>Love Parsica</h1>



  <!-- カテゴリー -->

  <details class="category">

    <summary>Category</summary>

    <div class="category-menu">

      <button onclick="showCategory('all')">
        ALL
      </button>

      <button onclick="showCategory('bag')">
        BAG
      </button>

      <button onclick="showCategory('pouch')">
        POUCH
      </button>

      <button onclick="showCategory('keychain')">
        KEYCHAIN
      </button>

    </div>

  </details>



  <!-- 商品一覧 -->

  <div class="products">


    <!-- 商品1 -->

    <div class="product" data-category="pouch">

      <a href="product.html" class="product-image-link">

        <div class="product-image">
          仮の商品画像
        </div>

      </a>

      <div class="product-name">
        Star Pouch
      </div>

      <div class="price">
        ¥2,500
      </div>

    </div>



    <!-- 商品2 -->

    <div class="product" data-category="bag">

      <a href="product2.html" class="product-image-link">

        <div class="product-image">
          仮の商品画像
        </div>

      </a>

      <div class="product-name">
        Ribbon Bag
      </div>

      <div class="price">
        ¥3,500
      </div>

    </div>



    <!-- 商品3 -->

    <div class="product" data-category="keychain">

      <a href="product3.html" class="product-image-link">

        <div class="product-image">
          仮の商品画像
        </div>

      </a>

      <div class="product-name">
        Heart Keychain
      </div>

      <div class="price">
        ¥1,500
      </div>

    </div>



    <!-- 商品4 -->

    <div class="product" data-category="pouch">

      <a href="product4.html" class="product-image-link">

        <div class="product-image">
          仮の商品画像
        </div>

      </a>

      <div class="product-name">
        Mini Pouch
      </div>

      <div class="price">
        ¥2,000
      </div>

    </div>


  </div>



  <!-- JavaScript -->

  <script>

    function showCategory(category) {

      const products = document.querySelectorAll(".product");


      products.forEach(function(product) {

        if (
          category === "all" ||
          product.dataset.category === category
        ) {

          product.style.display = "block";

        } else {

          product.style.display = "none";

        }

      });

    }

  </script>


</body>

</html>
